spring:
  application:
    name: onsinventory
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:inventorydb
    driver-class-name: org.h2.Driver
    username: sa
    password:

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    nl.seanderoo.inventory: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG

app:
  security:
    enabled: false
  bootstrap:
    enabled: true
  jwt:
    secret: ${APP_JWT_SECRET:onsinventory-jwt-secret-key-minimum-32-characters-long}
    expiration: 604800000
