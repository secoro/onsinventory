spring:
  application:
    name: onsinventory
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/postgresql
    baseline-on-migrate: true
    baseline-version: 1
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/inventorydb}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:inventory_user}
    password: ${SPRING_DATASOURCE_PASSWORD:inventory_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024

logging:
  level:
    root: WARN
    nl.seanderoo.inventory: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  security:
    enabled: true
  bootstrap:
    enabled: true
  jwt:
    secret: ${APP_JWT_SECRET:onsinventory-jwt-secret-key-minimum-32-characters-long}
    expiration: 604800000
  frontend-url: ${APP_FRONTEND_URL:https://onsinventory.com}
  mail:
    from: ${APP_MAIL_FROM:noreply@onsinventory.com}
  resend:
    api-key: ${RESEND_API_KEY:}
