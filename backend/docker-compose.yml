services:
  postgres:
    image: postgres:16-alpine
    container_name: onsinventory-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventorydb}
      POSTGRES_USER: ${POSTGRES_USER:-inventory_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inventory_user} -d ${POSTGRES_DB:-inventorydb}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onsinventory-network
    restart: unless-stopped

  onsinventory-backend:
    build: .
    container_name: onsinventory-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-inventorydb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-inventory_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_PROFILES_ACTIVE: prod
      APP_BOOTSTRAP_ENABLED: "true"
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://onsinventory.com,https://www.onsinventory.com}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-https://onsinventory.com}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-noreply@onsinventory.com}
      APP_MAIL_FEEDBACK_TO: ${APP_MAIL_FEEDBACK_TO:-onsinventory@onsinventory.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - onsinventory-network
    restart: unless-stopped

  onsinventory-frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.onsinventory.com}
    container_name: onsinventory-frontend
    depends_on:
      onsinventory-backend:
        condition: service_started
    networks:
      - onsinventory-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  onsinventory-network:
    driver: bridge
