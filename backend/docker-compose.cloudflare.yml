services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: onsinventory-cloudflared
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      caddy:
        condition: service_started
    networks:
      - onsinventory-network
    restart: unless-stopped

networks:
  onsinventory-network:
    driver: bridge
