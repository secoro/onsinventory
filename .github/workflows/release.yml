name: Release

# Manual release, maven-release-plugin style. Trigger it from the Actions tab
# (Actions -> Release -> Run workflow) and pick the bump. The workflow then:
#
#   1. computes the release version from the last tag (v4.0.0 + minor -> 4.1.0)
#   2. pins backend/pom.xml (4.0.1-SNAPSHOT -> 4.1.0) and frontend/package.json
#      (4.0.1-dev.0 -> 4.1.0) and commits, so the release contains the real
#      version numbers
#   3. tags that commit v4.1.0 and publishes the GitHub release from it
#   4. moves main to the next development iteration
#      (backend 4.1.1-SNAPSHOT, frontend 4.1.1-dev.0)
#   5. deploys the tag to the Raspberry Pi
#
# Day-to-day merges to main never release or deploy - only this workflow does.
# Don't create releases from the Releases page: the tag must contain the
# version-pin commit, which only exists once this workflow has run.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump for this release
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor
      version:
        description: Explicit version (e.g. 5.2.0) - overrides the bump
        required: false
        type: string

permissions:
  contents: write

# Never run two releases at once - the version commits and tag would race
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          # Deploy key: pushes over SSH bypass the main ruleset (the default
          # workflow token cannot push to the protected branch)
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Determine release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT: ${{ inputs.version }}
        run: |
          if [ -n "$EXPLICIT" ]; then
            VERSION="${EXPLICIT#v}"
          else
            # Only well-formed vX.Y.Z tags count; historical malformed tags
            # like v.2.0 (dot after the v) would corrupt the semver arithmetic
            LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
            LAST=${LAST:-v0.0.0}
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            case "$BUMP" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            VERSION="$MAJOR.$MINOR.$PATCH"
          fi

          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "'$VERSION' is not a valid X.Y.Z version"; exit 1;
          }
          if git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null; then
            echo "v$VERSION already exists"; exit 1;
          fi

          echo "Releasing v$VERSION"
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Pin versions and tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mvn -B -q -f backend/pom.xml versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          (cd frontend && npm version "$VERSION" --no-git-tag-version --allow-same-version)

          git add backend/pom.xml frontend/package.json frontend/package-lock.json
          git commit -m "release $TAG"
          git tag "$TAG"

      - name: Prepare next development iteration
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          NEXT="$MAJOR.$MINOR.$((PATCH + 1))"

          mvn -B -q -f backend/pom.xml versions:set -DnewVersion="$NEXT-SNAPSHOT" -DgenerateBackupPoms=false
          (cd frontend && npm version "$NEXT-dev.0" --no-git-tag-version)

          git add backend/pom.xml frontend/package.json frontend/package-lock.json
          git commit -m "prepare next development iteration ($NEXT-SNAPSHOT)"

      - name: Push and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git push origin main "$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes

  # Releases created with the workflow's own token don't fire the `release`
  # event (GitHub anti-recursion rule), so invoke the deploy workflow directly.
  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
