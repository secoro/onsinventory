name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test backend
        working-directory: backend
        run: mvn -B test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm run test

      - name: Add SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PI_SSH_PRIVATE_KEY }}

      - name: Add Raspberry Pi to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.PI_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repository to Raspberry Pi
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'backend/target' \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist' \
            ./ "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}:${{ secrets.PI_APP_PATH }}"

      - name: Deploy on Raspberry Pi
        run: |
          ssh "${{ secrets.PI_USER }}@${{ secrets.PI_HOST }}" '
            set -e
            cd "${{ secrets.PI_APP_PATH }}/backend"
            cat > .env.pi <<EOF
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            APP_BOOTSTRAP_ENABLED=${{ secrets.APP_BOOTSTRAP_ENABLED }}
            APP_CORS_ALLOWED_ORIGINS=${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            EOF
            docker compose --env-file .env.pi down
            docker compose --env-file .env.pi up -d --build
          '
