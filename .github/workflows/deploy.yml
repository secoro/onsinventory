name: Deploy to Raspberry Pi

# Runs when a release is published by hand, when the Release workflow calls it
# after an automatic version bump, or on demand via the Actions tab.
# Tests already gated the PR in CI, so this only builds and deploys.
on:
  release:
    types:
      - published
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref (tag) to deploy
        required: false
        type: string

permissions:
  contents: read

# Never run two deploys on the Pi at once; queue instead of cancel
concurrency:
  group: deploy-pi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Write environment file
        working-directory: backend
        run: |
          cat > .env.pi <<EOF
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          APP_BOOTSTRAP_ENABLED=${{ secrets.APP_BOOTSTRAP_ENABLED }}
          APP_CORS_ALLOWED_ORIGINS=${{ secrets.APP_CORS_ALLOWED_ORIGINS }}
          VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          APP_FRONTEND_URL=${{ secrets.APP_FRONTEND_URL }}
          APP_MAIL_FROM=${{ secrets.APP_MAIL_FROM }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          EOF

      - name: Build and deploy
        working-directory: backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.cloudflare.yml --env-file .env.pi up -d --build --remove-orphans

      - name: Clean up old images
        run: docker image prune -f
